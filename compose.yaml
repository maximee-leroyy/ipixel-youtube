# Linux image (amd64 + arm64) published to GHCR on every push to main.
#   nerdctl pull ghcr.io/maximee-leroyy/ipixel-youtube:latest
#   nerdctl compose up -d
#
# Local build: nerdctl compose build
#
# Empty variables = CLI default value (single source: src/ipixel/cli.py).
# Several panels: see "Several panels" in the README.

name: ipixel

services:
  ipixel:
    image: ghcr.io/maximee-leroyy/ipixel-youtube:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: ipixel
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /run/dbus/system_bus_socket:/host/dbus/system_bus_socket
      - ./cookies.txt:/app/cookies.txt
    environment:
      IPIXEL_ADDRESS: ${IPIXEL_ADDRESS:-}
      IPIXEL_BRIGHTNESS: ${IPIXEL_BRIGHTNESS:-}
      YOUTUBE_CHANNEL: ${YOUTUBE_CHANNEL:-}
      YOUTUBE_SOURCE: ${YOUTUBE_SOURCE:-}
      YOUTUBE_DEBUG: ${YOUTUBE_DEBUG:-}
      # Logs: local time in this time zone (empty = UTC). E.g. TZ=Europe/Paris.
      TZ: ${TZ:-}
