# Image Linux (amd64 + arm64) publiée sur GHCR à chaque push sur main.
#   nerdctl pull ghcr.io/maximee-leroyy/ipixel-youtube:latest
#   nerdctl compose up -d
#
# Build local : nerdctl compose build

name: ipixel

services:
  ipixel:
    image: ghcr.io/maximee-leroyy/ipixel-youtube:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: ipixel
    restart: unless-stopped
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /run/dbus/system_bus_socket:/host/dbus/system_bus_socket
      - ./cookies.txt:/app/cookies.txt
    environment:
      IPIXEL_ADDRESS: ${IPIXEL_ADDRESS:-}
      IPIXEL_BRIGHTNESS: ${IPIXEL_BRIGHTNESS:-1}
      YOUTUBE_CHANNEL: ${YOUTUBE_CHANNEL:-@example}
      YOUTUBE_COOKIES: /app/cookies.txt
      YOUTUBE_DEBUG: ${YOUTUBE_DEBUG:-}
      HOST_DBUS_SOCKET: /host/dbus/system_bus_socket
